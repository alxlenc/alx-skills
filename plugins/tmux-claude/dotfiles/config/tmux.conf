# --- Sensible Defaults (tmux-sensible) ---------------------------------------

set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g default-terminal "screen-256color"
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# Use tmux-256color if the terminfo entry exists
if -b '[ -n "$(command -v infocmp)" ] && infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"'

# True color support
set -sa terminal-overrides ",*256col*:Tc"

# --- General Settings --------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W — #T"
set -g mouse on

# --- Prefix ------------------------------------------------------------------

# Keep C-b, add C-a as secondary prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# --- Navigation Keybindings --------------------------------------------------

# Vi-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing (Shift + hjkl)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Pane swap
bind > swap-pane -D
bind < swap-pane -U

# Pane maximize (zoom toggle)
bind + resize-pane -Z

# Intuitive splits (open in current path)
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window

# Window reorder
bind -r C-S-H swap-window -d -t -1
bind -r C-S-L swap-window -d -t +1

# Window/session chooser: tmux default tree + window id (@N) per window line.
# The format lives in a user option so every entry point shows the same tree;
# #{E:...} re-expands the option as a format once per tree item.
set -g @window_tree_format '#{?pane_format,#{pane_current_command} "#{pane_title}",#{?window_format,#{window_id} #{window_name}#{window_flags} (#{window_panes} panes)#{?#{==:#{window_panes},1}, "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'

bind w choose-tree -Zw -F '#{E:@window_tree_format}'

# Left-click the session pill in the status bar for the same picker. tmux wraps
# status-left in `range=left` by default and leaves button 1 there unbound (only
# MouseDown3StatusLeft is taken, by the session menu), so the pill is a free
# click target — no status-format changes needed.
bind -n MouseDown1StatusLeft choose-tree -Zw -F '#{E:@window_tree_format}'

# Session management
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# Last window / last session
bind Tab last-window
bind BTab switch-client -l

# --- Copy Mode (vi-style) ---------------------------------------------------

setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi PageUp send -X page-up
bind -T copy-mode-vi PageDown send -X page-down

# Enter copy mode and scroll up with just PageUp (no prefix needed)
bind -n PageUp copy-mode \; send -X page-up

# --- Clipboard (cross-platform + OSC 52 for SSH) ----------------------------

# OSC 52 — lets tmux push clipboard over SSH if the terminal supports it
set -s set-clipboard on

# Platform-aware yank: copy tmux buffer to system clipboard
if -b '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | wl-copy"'
if -b '[ -z "$WAYLAND_DISPLAY" ] && [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | xsel -ib"'
if -b '[ -z "$WAYLAND_DISPLAY" ] && [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard"'
if -b 'command -v pbcopy >/dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | pbcopy"'
if -b 'command -v clip.exe >/dev/null 2>&1' \
  'bind y run -b "tmux save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' \
  'bind y run -b "tmux save-buffer - > /dev/clipboard"'

# Platform-aware paste: system clipboard into tmux
if -b '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-paste >/dev/null 2>&1' \
  'bind C-p run "wl-paste -n | tmux load-buffer -" \; paste-buffer -p'
if -b '[ -z "$WAYLAND_DISPLAY" ] && [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1' \
  'bind C-p run "xsel -ob | tmux load-buffer -" \; paste-buffer -p'
if -b '[ -z "$WAYLAND_DISPLAY" ] && [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
  'bind C-p run "xclip -o -selection clipboard | tmux load-buffer -" \; paste-buffer -p'
if -b 'command -v pbpaste >/dev/null 2>&1' \
  'bind C-p run "pbpaste | tmux load-buffer -" \; paste-buffer -p'
if -b 'command -v powershell.exe >/dev/null 2>&1' \
  'bind C-p run "powershell.exe -c Get-Clipboard | tmux load-buffer -" \; paste-buffer -p'

# --- Buffer Management -------------------------------------------------------

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# --- Open File from Buffer ---------------------------------------------------

# Double-click selects full file paths by excluding / . - ~ : + from word separators
set -g word-separators ' "=,;{}()[]<>|&!@#$%^*?`'"'"

# prefix + o: open file path in tmux buffer in a right split (supports file:line)
bind o run-shell '~/.tmux/scripts/open-file-from-buffer.sh "#{pane_current_path}"'

# --- URL Extraction & PathPicker ---------------------------------------------

# prefix + U: open URLs from pane (urlscan preferred, falls back to urlview)
bind U run -b '\
  if command -v urlscan >/dev/null 2>&1; then \
    tmux capture-pane -J -p | urlscan; \
  elif command -v urlview >/dev/null 2>&1; then \
    tmux capture-pane -J -p | urlview; \
  else \
    tmux display-message "urlscan/urlview not found"; \
  fi'

# prefix + F: open paths from pane with Facebook PathPicker
bind F run -b '\
  if command -v fpp >/dev/null 2>&1; then \
    tmux capture-pane -J -p | fpp; \
  else \
    tmux display-message "fpp not found"; \
  fi'

# --- Mouse Toggle ------------------------------------------------------------

bind m run -b '\
  current=$(tmux show -gv mouse); \
  if [ "$current" = "on" ]; then \
    tmux set -g mouse off \; display-message "Mouse: OFF"; \
  else \
    tmux set -g mouse on \; display-message "Mouse: ON"; \
  fi'

# --- Config Edit & Reload ----------------------------------------------------

bind e run -b '\
  editor="${VISUAL:-${EDITOR:-vim}}"; \
  tmux new-window -n "tmux.conf" "$editor ~/.config/tmux/tmux.conf && tmux source-file ~/.config/tmux/tmux.conf && tmux display-message \"Config reloaded\""'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# --- Screen + History Clear --------------------------------------------------

bind -n C-l send-keys C-l \; run -b 'sleep 0.2 && tmux clear-history'

# --- Catppuccin Mocha Theme ---------------------------------------------------
# Palette reference:
#   Crust=#11111b  Mantle=#181825  Base=#1e1e2e
#   Surface0=#313244  Surface1=#45475a  Surface2=#585b70
#   Overlay0=#6c7086  Subtext0=#a6adc8  Text=#cdd6f4
#   Lavender=#b4befe  Blue=#89b4fa  Sapphire=#74c7ec
#   Teal=#94e2d5  Mauve=#cba6f7  Peach=#fab387

# Status bar
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 60

# Left: session name (rounded pill) — truncated on narrow screens
set -g status-left "#{?#{e|<:#{client_width},60},#[bg=#cba6f7]#[fg=#11111b]#[bold] #{=8:session_name} #[bg=#181825]#[fg=#cba6f7]#[none] ,#[bg=#cba6f7]#[fg=#11111b]#[bold] #S #[bg=#181825]#[fg=#cba6f7]#[none] }"

# Window list — index only on narrow screens, extra padding for touch targets
set -g window-status-format "#{?#{e|<:#{client_width},60},#[fg=#6c7086]   #I   ,#[fg=#6c7086] #I #W }"
set -g window-status-current-format "#{?#{e|<:#{client_width},60},#[bg=#313244]#[fg=#b4befe]#[bold]   #I   #[bg=#181825]#[none],#[bg=#313244]#[fg=#b4befe]#[bold] #I #W #[bg=#181825]#[none]}"
set -g window-status-separator ""

# Right: agent indicator + time + date — progressively hidden on narrow screens
set -g status-right "#{?#{e|<:#{client_width},60},#[fg=#a6adc8]#{agent_indicator} ,#{?#{e|<:#{client_width},100},#[fg=#a6adc8]#{agent_indicator} #[fg=#585b70]│ #[fg=#74c7ec]%H:%M ,#[fg=#a6adc8]#{agent_indicator} #[fg=#585b70]│ #[fg=#74c7ec]%H:%M #[fg=#585b70]│ #[fg=#94e2d5]%a %d }}"

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#b4befe"

# Message / command prompt styling
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#fab387"

# Clock mode
set -g clock-mode-colour "#89b4fa"

# Copy mode highlight
set -g mode-style "bg=#585b70,fg=#cdd6f4"

# --- Plugins -----------------------------------------------------------------

# Agent indicator (visual feedback for AI agent states)
run-shell ~/.tmux/plugins/tmux-agent-indicator/agent-indicator.tmux

# Clipboard image paste (prefix + I saves clipboard image, types /image into Claude).
# Source: @paste-image-clip-command (if set) else local wl-paste/xclip — see README.
set -g @paste-image-key "I"
run-shell 'tmux bind-key "$(tmux show-option -gqv @paste-image-key)" run-shell ~/.tmux/scripts/paste-image.sh'

# --- Per-machine overrides (not version-controlled) --------------------------
# Drop host-specific settings (e.g. @paste-image-clip-command on a headless
# server) in ~/.config/tmux/local.conf — sourced last so it can override above.
if-shell '[ -f ~/.config/tmux/local.conf ]' 'source-file ~/.config/tmux/local.conf'
